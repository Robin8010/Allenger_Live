_schema-version: 3.3.0
ID: AllengersQc
description: Quality Control.
version: 1.0.194
modules:
  - name: AllengersQc-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: AllengersQc-db
      - name: AllengersQc-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: AllengersQc-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: AllengersQc-db
    parameters:
      buildpack: nodejs_buildpack
  - name: AllengersQc
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: AllengersQc-destination
      - name: AllengersQc-repo-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M
  - name: AllengersQc-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: AllengersQc-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - qcui.zip
          name: qcui
          target-path: resources/
  - name: qcui
    type: html5
    path: app/qcui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: AllengersQc-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: AllengersQc-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite
  - name: AllengersQc-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: AllengersQc-html5-service
      service-plan: app-host
  - name: AllengersQc-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
